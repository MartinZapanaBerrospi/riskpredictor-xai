version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riskpredictor-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/riskpredictor
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  db:
    image: postgres:16-alpine
    container_name: riskpredictor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: riskpredictor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
